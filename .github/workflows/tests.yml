name: Tests
on:
  push:
    branches:
      - master
    paths: &paths
      - "server/**"
      - "common/**"
      - "*.json"
      - "bun.lock"
      - ".github/workflows/tests.yml"
  pull_request:
    paths: *paths
jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    concurrency: ci-tests-${{ github.ref }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Packages
        run: bun ci --filter server --filter common --filter tests

      - name: Run Tests
        run: bun run test
        working-directory: ./tests
